name: Publish shift schedule

on:
  push:
    paths:
      - "updates/*.xlsx"
      - "index.html"
      - "years.json"
      - "data/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert newest Excel
        run: |
          pip install openpyxl
          if ls updates/*.xlsx >/dev/null 2>&1; then
            python scripts/update_from_excel.py
          fi

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data years.json
          git diff --cached --quiet || git commit -m "Update shift schedule [skip excel]"
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
